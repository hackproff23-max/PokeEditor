plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.fabricio.pokeedit'
    compileSdk 34
    defaultConfig {
        applicationId 'com.fabricio.pokeedit'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    signingConfigs {
        debug {
            storeFile file('pokeeditor.jks')
            storePassword 'pokeeditor123'
            keyAlias 'pokeeditor'
            keyPassword 'pokeeditor123'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}
